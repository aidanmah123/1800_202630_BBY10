<!DOCTYPE html>
<html lang="en">

<head>
    <title>Memories Box</title>
    <meta name="comp1800 template" content="My 1800 App">

    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Other libraries go here -->
    <link rel="stylesheet" href="./styles/style.css">
</head>

<body>

    <!------------------------------>
    <!-- Your HTML Layout go here -->
    <!------------------------------>
    <!-- Stuff for body goes here -->

    <header>
        <nav class="navbar">
            <a href="./index.html">Home</a>
        </nav>
    </header>

    <div class="card border-0 shadow-sm p-4">
        <div class="card border-0 shadow-sm p-4">
            <div class="text-center mb-4">
                <div class="text-success display-4 mb-2"><i class="bi bi-shield-lock-fill"></i></div>
                <h2 class="h4">Ready to Lock Your Time Capsule?</h2>
                <p class="text-muted small">Please review your memory details before scheduling.</p>
            </div>
            <div class="bg-light p-3 rounded mb-4 border">
                <p><strong>Title:</strong> <span id="confirmTitle"></span></p>

                <p><strong>Letter:</strong></p>
                <p id="confirmContent" style="white-space: pre-wrap;"></p>

                <p><strong>Recipient Email:</strong> <span id="confirmEmail"></span></p>

                <p><strong>Unlock Date:</strong> <span id="confirmUnlockAt"></span></p>
            </div>
            <div>
                <p><strong>Attached Media:</strong> <span id="confirmMedia"></span></p>
            </div>
        </div>

        <div class="d-flex gap-2">
            <a href="./calendar.html" class="btn btn-outline-secondary w-50">Edit Details</a>
            <button type="button" id="lockCapsule" class="btn btn-success w-50 fw-semibold" disabled>
                Lock &amp; Schedule
            </button>
        </div>
    </div>
    </section>

    <!---------------------------------------------->
    <!-- Your own JavaScript functions go here    -->
    <!---------------------------------------------->

    <!-- Link to scripts of your own -->
    <script type="module" src="./src/main.js"></script>
    <script type="module" src="./src/confirm.js"></script>

</body>

</html>
