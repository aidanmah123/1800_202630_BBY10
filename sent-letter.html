<!DOCTYPE html>
<html lang="en">

<head>
    <title>Memories Box</title>
    <meta name="comp1800 template" content="My 1800 App">

    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Other libraries go here -->
    <link rel="stylesheet" href="./styles/style.css">
</head>

<body>

    <!------------------------------>
    <!-- Your HTML Layout go here -->
    <!------------------------------>
    <!-- Stuff for body goes here -->

    <section class="container my-5" style="max-width: 600px;">
        <div class="card border-0 shadow-sm p-4">
            <div class="d-flex align-items-center gap-3 mb-3 pb-3 border-bottom">
                <div class="bg-primary text-white rounded-circle d-flex align-items-center justify-content-center fw-bold" style="width: 48px; height: 48px;">
                    AM
                </div>
                <div>
                    <h1 class="h5 mb-0 fw-bold">Aidan M. sent you a Time Capsule</h1>
                    <span class="text-muted small">Received today</span>
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label text-muted small fw-bold">MESSAGE</label>
                <div class="p-3 bg-light rounded border">
                    "Always take time to celebrate the small wins along the way. Here is some advice for your journey ahead!"
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label text-muted small fw-bold">ATTACHMENTS</label>
                <div class="list-group">
                    <div class="list-group-item d-flex justify-content-between align-items-center py-2">
                        <div class="d-flex align-items-center gap-2">
                            <i class="bi bi-file-image text-primary fs-5"></i>
                            <span class="small fw-semibold">graduation_memory.jpg</span>
                        </div>
                        <a href="#" class="btn btn-sm btn-outline-primary"><i class="bi bi-download"></i></a>
                    </div>
                    <div class="list-group-item d-flex justify-content-between align-items-center py-2">
                        <div class="d-flex align-items-center gap-2">
                            <i class="bi bi-file-earmark-play text-danger fs-5"></i>
                            <span class="small fw-semibold">video_advice.mp4</span>
                        </div>
                        <a href="#" class="btn btn-sm btn-outline-primary"><i class="bi bi-download"></i></a>
                    </div>
                </div>
            </div>

            <a href="./index.html" class="btn btn-primary w-100 fw-semibold">
                Create a box for Yourself
            </a>
        </div>
    </section>

    <!---------------------------------------------->
    <!-- Your own JavaScript functions go here    -->
    <!---------------------------------------------->

    <!-- Link to scripts of your own -->
    <script type="module" src="./src/main.js"></script>

</body>

</html>
