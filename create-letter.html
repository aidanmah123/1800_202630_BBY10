<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Create Letter - Time Capsule</title>
  <link rel="stylesheet" href="./styles/style.css" />
  <script type="module" src="./src/app.js"></script>
  <script type="module" src="./src/components/site-navbar.js"></script>
</head>

<body class="letter-page">
  <site-navbar></site-navbar>

  <main class="letter-container">
    <div class="row align-items-center g-0 mb-3">
      <div class="col-2">
      <a href="./box-creation.html" class="btn btn-light text-primary rounded-circle fs-3 lh-1 p-2"
        aria-label="Back to letter">
        <div aria-hidden="true">←</div>
      </a>
      </div>
      <h1 class="col-8 h4 text-center mb-0">Create a Letter</h1>
    </div>

    <p>Write a message for someone or your future self.</p>
    
    <form id="letterForm">
      <label for="letterTitle">Letter Title:</label>
      <input type="text" id="letterTitle" placeholder="Enter a title" required />

      <label for="letterMessage">Your Message:</label>
      <textarea id="letterMessage" placeholder="Write your letter here..." rows="8" required></textarea>

      <label for="letterUpload">Upload Image:</label>
      <input type="file" id="letterUpload" accept="image/jpeg,image/png,image/webp" />
      <p role="status">
        <strong id="photoLabel">Photo:</strong>
        <span id="photoNameDisplay">No photo selected.</span>
      </p>
      <button type="submit">Create</button>
    </form>

    <p id="letterStatus" role="status"></p>
  </main>

  <script type="module" src="./src/createLetter.js"></script>
</body>

</html>
